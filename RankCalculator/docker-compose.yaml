services:
  rabbitmq:
    image: rabbitmq:3.13.7
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"  
      - "15672:15672" 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  my-redis:
    image: redis:latest
    container_name: my-redis
    hostname: my-redis
    ports:
      - '6379:6379'

volumes:
  rabbitmq_data: