services:
  redis-main:
    image: redis:latest
    container_name: "redis-main"
    ports:
      - "6000:6379"
    command: ["redis-server", "--requirepass", "${REDIS_MAIN_PASS}"]

  redis-ru:
    image: redis:latest
    container_name: "redis-ru"
    ports:
      - "6001:6379"
    command: ["redis-server", "--requirepass", "${REDIS_RU_PASS}"]

  redis-eu:
    image: redis:latest
    container_name: "redis-eu"
    ports:
      - "6002:6379"
    command: ["redis-server", "--requirepass", "${REDIS_EU_PASS}"]

  redis-asia:
    image: redis:latest
    container_name: "redis-asia"
    ports:
      - "6003:6379"
    command: ["redis-server", "--requirepass", "${REDIS_ASIA_PASS}"]

  rabbitmq-pa3:
    image: rabbitmq:3.13.7
    container_name: rabbitmq-pa3
    hostname: rabbitmq-pa3
    volumes:
      - rabbitmq_pa3_data:/var/lib/rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

volumes:
  rabbitmq_pa3_data: